apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: inference-logger
  namespace: inference-logger
  annotations:
    kubernetes.io/ingress.class: traefik
spec:
  ingressClassName: traefik
  rules:
    - host: inference-logger.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 4000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
  # tls:
  #   - hosts:
  #       - inference-logger.example.com
  #     secretName: inference-logger-tls
  # Add cert-manager or a manual TLS secret later if HTTPS termination is required.
